site_name: Entregas de Deep Learning e Redes Neurais
site_author: Laura Pontiroli Machado
site_url: https://laupontiroli.github.io/deep_learning_class
repo_url: https://github.com/laupontiroli/deep_learning_class
repo_name: github/deep_learning_class

theme:
  name: material
  font:
    text: Quicksand
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Modo escuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-night
        name: Modo claro
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.expand
    - navigation.footer
    - toc.follow
  icon:
    admonition:
      note: material/notebook-heart-outline
      abstract: material/book-open-page-variant-outline
      info: material/information-outline
      tip: material/lightbulb-on-outline
      success: material/check-circle-outline
      question: material/help-circle-outline
      warning: material/alert-outline
      failure: material/close-circle-outline
      danger: material/skull-outline
      bug: material/bug-outline
      example: material/flask-outline
      quote: material/format-quote-open

      
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - markdown_grid_tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji 
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      url_download: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: python
          class: python
          validator: !!python/name:markdown_exec.validator
          format: !!python/name:markdown_exec.formatter
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true  
  - footnotes
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.blocks.caption
  - tables
      
plugins:
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
  - git-authors
  - git-committers:
      repository: laupontiroli/deep_learning_class
      branch: main
  - search
  - badges
  - minify:
      minify_html: true
  - markdown-exec
  - render_swagger:
      allow_arbitrary_locations : true
  - termynal:
      prompt_literal_start:
        - "$"
        - ">"

# mkdocs-jupyter
  - mkdocs-jupyter:
      execute: false
      allow_errors: false

extra_javascript:
  - https://unpkg.com/mathjax/es5/tex-mml-chtml.js
  # - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://fastly.jsdelivr.net/npm/jquery/dist/jquery.min.js
  - https://fastly.jsdelivr.net/npm/echarts/dist/echarts.min.js

  # Para a implementação do mkdocs-jupyter
  - javascripts/mathjax.js

nav:
  - Home: index.md
  - This documentation: ./thisdocumentation/index.md
  - Roteiros:
    - Roteiro 1: ./roteiro1/index.md
    - Roteiro 2: ./roteiro2/index.md
    - Roteiro 3: ./roteiro3/index.md
    - Roteiro 4: ./roteiro4/index.md
    - Notebook 1: ./notebook1/ex1_data.ipynb
  - Projeto: ./projeto/index.md
